<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplinterOps Badge Visualizer</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a2e;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent: #00d4ff;
            --accent-dim: #005577;
            --border: #2a2a3e;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        header h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            transition: background 0.3s;
        }

        .status-dot.connected { background: var(--success); }

        select {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 320px;
            grid-template-rows: 1fr auto auto;
            flex: 1;
            gap: 0;
            overflow: hidden;
        }

        /* LED Visualizer */
        .led-panel {
            grid-row: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            position: relative;
        }

        #ledCanvas {
            max-width: 100%;
            max-height: 100%;
        }

        /* Right sidebar */
        .sidebar {
            grid-row: 1;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel {
            border-bottom: 1px solid var(--border);
        }

        .panel-header {
            padding: 10px 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
        }

        .panel-body {
            padding: 12px 16px;
        }

        /* Touch Sensor Panel */
        .touch-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .touch-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
            -webkit-user-select: none;
        }

        .touch-btn:hover {
            border-color: var(--accent-dim);
            background: #1e1e35;
        }

        .touch-btn:active, .touch-btn.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: white;
        }

        .touch-btn.touched { background: #003355; border-color: #0088cc; }
        .touch-btn.short-pressed { background: #004466; border-color: #00aaff; }
        .touch-btn.long-pressed { background: #005577; border-color: #00ccff; }
        .touch-btn.very-long-pressed { background: #226688; border-color: #44eeff; }

        .touch-btn .label {
            font-size: 11px;
            font-weight: 600;
            display: block;
        }

        .touch-btn .index {
            font-size: 9px;
            color: var(--text-secondary);
            display: block;
            margin-top: 2px;
        }

        .touch-btn .keyhint {
            font-size: 9px;
            color: var(--accent-dim);
            display: block;
            margin-top: 3px;
            font-weight: 600;
        }

        /* Status Panel */
        .status-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
        }

        .status-label { color: var(--text-secondary); }
        .status-value { color: var(--text-primary); font-weight: 500; }

        /* Event Log */
        .event-log {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .event-log .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            font-size: 11px;
            max-height: 200px;
        }

        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            gap: 8px;
        }

        .log-time {
            color: var(--text-secondary);
            flex-shrink: 0;
            width: 65px;
        }

        .log-msg { color: var(--text-primary); }
        .log-msg.touch { color: var(--accent); }
        .log-msg.mode { color: var(--warning); }
        .log-msg.error { color: var(--danger); }
        .log-msg.info { color: var(--success); }

        /* FPS counter */
        .fps-display {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Console Log Panel */
        .console-panel {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            max-height: 280px;
            min-height: 120px;
            overflow: hidden;
        }

        .console-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .console-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .console-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .console-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .console-controls label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .console-controls select {
            font-size: 11px;
            padding: 3px 8px;
        }

        .console-controls button {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 3px 10px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .console-controls button:hover {
            color: var(--text-primary);
            border-color: var(--accent-dim);
        }

        .console-body {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            font-size: 12px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            line-height: 1.5;
        }

        .console-line {
            padding: 1px 16px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .console-line:hover {
            background: rgba(255,255,255,0.03);
        }

        .console-line.level-error { color: var(--danger); }
        .console-line.level-warn { color: var(--warning); }
        .console-line.level-info { color: var(--text-primary); }
        .console-line.level-debug { color: #7a8a9a; }
        .console-line.level-verbose { color: #5a6a7a; }

        .console-line-count {
            font-size: 10px;
            color: var(--text-secondary);
            background: var(--bg-primary);
            padding: 1px 6px;
            border-radius: 8px;
        }

        .log-level-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .log-level-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .log-level-badge .dot.error { background: var(--danger); }
        .log-level-badge .dot.warn { background: var(--warning); }
        .log-level-badge .dot.info { background: var(--success); }
        .log-level-badge .dot.debug { background: #7a8a9a; }
        .log-level-badge .dot.verbose { background: #5a6a7a; }

        /* Bottom bar */
        .bottom-bar {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <header>
        <h1>SPLINTEROPS BADGE VISUALIZER</h1>
        <div class="header-controls">
            <div class="fps-display" id="fpsDisplay">0 fps</div>
            <select id="badgeSelect">
                <option value="TRON">TRON (77 LEDs)</option>
                <option value="REACTOR">REACTOR (48 LEDs)</option>
                <option value="CREST">CREST (59 LEDs)</option>
                <option value="FMAN25" selected>FMAN25 (45 LEDs)</option>
            </select>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div class="led-panel">
            <canvas id="ledCanvas" width="600" height="600"></canvas>
        </div>

        <div class="sidebar">
            <div class="panel">
                <div class="panel-header">Touch Sensors</div>
                <div class="panel-body">
                    <div class="touch-grid" id="touchGrid"></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">Status</div>
                <div class="panel-body" id="statusPanel">
                    <div class="status-row">
                        <span class="status-label">LED Mode</span>
                        <span class="status-value" id="ledModeValue">—</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Inner State</span>
                        <span class="status-value" id="innerStateValue">—</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Outer State</span>
                        <span class="status-value" id="outerStateValue">—</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Frames Recv</span>
                        <span class="status-value" id="framesRecvValue">0</span>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">Buzzer</div>
                <div class="panel-body">
                    <div class="status-row">
                        <span class="status-label">Status</span>
                        <span class="status-value" id="buzzerStatus">Silent</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Frequency</span>
                        <span class="status-value" id="buzzerFrequency">&mdash;</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Volume</span>
                        <input type="range" id="buzzerVolume" min="0" max="100" value="15"
                            style="width:100px; accent-color:var(--accent);">
                    </div>
                    <div class="status-row">
                        <span class="status-label">Mute</span>
                        <button id="buzzerMuteBtn"
                            style="background:var(--bg-tertiary);color:var(--text-secondary);
                            border:1px solid var(--border);border-radius:4px;padding:3px 10px;
                            font-family:inherit;font-size:11px;cursor:pointer;">
                            &#x1F50A; On
                        </button>
                    </div>
                </div>
            </div>

            <div class="panel event-log">
                <div class="panel-header">Event Log</div>
                <div class="panel-body" id="eventLog"></div>
            </div>
        </div>

        <div class="console-panel">
            <div class="console-header">
                <div class="console-header-left">
                    <span class="console-title">Console Logs</span>
                    <span class="console-line-count" id="consoleLineCount">0 lines</span>
                </div>
                <div class="console-controls">
                    <label for="logLevelFilter">Level:</label>
                    <select id="logLevelFilter">
                        <option value="verbose">Verbose</option>
                        <option value="debug">Debug</option>
                        <option value="info" selected>Info</option>
                        <option value="warn">Warning</option>
                        <option value="error">Error</option>
                    </select>
                    <label for="logTagFilter">Tag:</label>
                    <input type="text" id="logTagFilter" placeholder="Filter by tag..."
                        style="background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-family:inherit;font-size:11px;width:120px;">
                    <button id="consoleClearBtn">Clear</button>
                    <button id="consoleScrollLockBtn" title="Auto-scroll">⬇ Auto</button>
                </div>
            </div>
            <div class="console-body" id="consoleBody"></div>
        </div>

        <div class="bottom-bar">
            <span>WebSocket: ws://localhost:8765</span>
            <span id="ledCountDisplay">0 LEDs</span>
        </div>
    </div>

    <script src="viz.js"></script>
</body>
</html>
